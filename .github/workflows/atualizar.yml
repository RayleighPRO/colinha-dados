name: Atualizar dados do TSE
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar dados/
        run: python atualizar_dados.py
        env:
          TSE_DESPESAS_ZIP: ${{ vars.TSE_DESPESAS_ZIP }}
      - name: Publicar mudanças
        run: |
          git config user.name "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          git add dados
          git diff --cached --quiet || (git commit -m "Atualiza dados do TSE" && git push)
